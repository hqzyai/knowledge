name: hqzy-knowledge

# 云服务器部署：复用现有 agentos-postgres、agentos-redis 和 ragflow-es。
# 本文件只部署 WeKnora、DocReader、RustFS、Neo4j；所有服务加入现有
# agentos-network，应用额外加入 ragflow_ragflow 以访问 Elasticsearch。

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: hqzy-knowledge-app
    env_file:
      - path: .env.cloud
        required: false
    environment:
      # This deployment uses Elasticsearch for vector retrieval and does not
      # enable DuckDB's optional CSV/Excel data-analysis extensions.
      DUCKDB_SKIP_EXTENSION_LOAD: "1"
    volumes:
      - app-data:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ./config.yaml:/app/config/config.yaml:ro
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    depends_on:
      docreader:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    networks:
      agentos-network:
      ragflow-network:
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: hqzy-knowledge-frontend
    environment:
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      APP_HOST: app
      APP_PORT: "8081"
      APP_SCHEME: http
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-8083}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - agentos-network
    restart: unless-stopped

  docreader:
    image: ${DOCREADER_IMAGE:-wechatopenai/weknora-docreader:latest}
    container_name: hqzy-knowledge-docreader
    expose:
      - "50051"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      DOCREADER_GRPC_MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      DOCREADER_GRPC_PORT: "50051"
      GRPC_AUTH_TOKEN: ${GRPC_AUTH_TOKEN:?GRPC_AUTH_TOKEN is required}
    volumes:
      - docreader-tmp:/tmp/docreader
    healthcheck:
      test:
        - CMD
        - /bin/grpc_health_probe
        - -addr=127.0.0.1:50051
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - agentos-network
    restart: unless-stopped

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: hqzy-knowledge-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_BIND:-127.0.0.1}:${RUSTFS_PORT:-19000}:9000"
      - "${RUSTFS_BIND:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-19001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # RustFS currently returns 403 for unauthenticated health requests; any
      # HTTP response proves the API listener is ready. wget is in the image.
      test: ["CMD-SHELL", "wget -S -O /dev/null http://localhost:9000/health 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - agentos-network
    restart: unless-stopped

  rustfs-init:
    image: ${RUSTFS_CLI_IMAGE:-rustfs/rc:latest}
    container_name: hqzy-knowledge-rustfs-init
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /usr/bin/rc alias set rustfs http://rustfs:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        /usr/bin/rc bucket create "rustfs/$${S3_BUCKET_NAME}" --ignore-existing
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-weknora}
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - agentos-network
    restart: "no"

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2025.10.1}
    container_name: hqzy-knowledge-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${NEO4J_BIND:-127.0.0.1}:${NEO4J_HTTP_PORT:-17474}:7474"
      - "${NEO4J_BIND:-127.0.0.1}:${NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j-data:/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks:
      - agentos-network
    restart: unless-stopped

networks:
  agentos-network:
    external: true
    name: agentos-network
  ragflow-network:
    external: true
    name: ragflow_ragflow

volumes:
  app-data:
    name: hqzy-knowledge-app-data
  docreader-tmp:
    name: hqzy-knowledge-docreader-tmp
  rustfs-data:
    name: hqzy-knowledge-rustfs-data
  neo4j-data:
    name: hqzy-knowledge-neo4j-data
