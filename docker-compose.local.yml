# 当前仓库的本地容器化部署：只运行 WeKnora 后端和前端，复用已部署的
# PostgreSQL、Redis、DocReader、Neo4j。
#
# 前置条件：
#   1. 中间件容器已连接到 weknora_WeKnora-network-dev；
#   2. 首次构建前端镜像前执行 ./scripts/build_frontend_dist.sh；
#   3. 使用 docker compose -f docker-compose.local.yml up -d --build 启动。

name: hqzy-knowledge

services:
  app:
    image: hqzy-knowledge-app:${LOCAL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APK_MIRROR_ARG: ${APK_MIRROR_ARG:-}
        GOPROXY_ARG: ${GOPROXY_ARG:-https://goproxy.cn,direct}
    container_name: hqzy-knowledge-app
    env_file:
      - .env
    environment:
      # .env 中的 15432 是宿主机映射端口；容器间通过 PostgreSQL 内部端口通信。
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_ADDR: redis:6379
      DOCREADER_ADDR: docreader:50051
      DOCREADER_TRANSPORT: grpc
      NEO4J_URI: bolt://neo4j:7687
      LOCAL_STORAGE_BASE_DIR: /data/files
      # 本地容器可能无法访问 DuckDB 扩展站点，避免启动阶段无限等待。
      DUCKDB_SKIP_EXTENSION_LOAD: "1"

      # RustFS 提供 S3 兼容接口，应用只使用标准 S3 provider。
      STORAGE_TYPE: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-weknora}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-weknora-rustfs-change-me}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-weknora}
      S3_PATH_PREFIX: ${S3_PATH_PREFIX:-weknora/}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SSRF_WHITELIST_EXTRA: rustfs

      # Docker sandbox 依赖宿主机 Docker CLI 和文件系统路径映射，直接放在
      # app 容器内运行并不安全可靠。需要沙箱时可显式设置
      # COMPOSE_SANDBOX_MODE=local，或改用 cube/e2b 后端。
      WEKNORA_SANDBOX_MODE: ${COMPOSE_SANDBOX_MODE:-disabled}
    ports:
      # config/config.yaml 当前监听 8081，因此宿主机和容器端口都使用 8081。
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8081}:8081"
    volumes:
      - app-data:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ./config/config.yaml:/app/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      middleware:
        aliases:
          - app
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    container_name: hqzy-knowledge-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-weknora}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-weknora-rustfs-change-me}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_BIND:-127.0.0.1}:${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_BIND:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - middleware
    restart: unless-stopped

  rustfs-init:
    image: rustfs/rc:${RUSTFS_CLI_VERSION:-latest}
    container_name: hqzy-knowledge-rustfs-init
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /usr/bin/rc alias set rustfs http://rustfs:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        /usr/bin/rc bucket create "rustfs/$${S3_BUCKET_NAME}" --ignore-existing
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-weknora}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-weknora-rustfs-change-me}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-weknora}
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - middleware
    restart: "no"

  frontend:
    image: hqzy-knowledge-frontend:${LOCAL_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hqzy-knowledge-frontend
    environment:
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      APP_HOST: app
      APP_PORT: "8081"
      APP_SCHEME: http
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - middleware
    restart: unless-stopped

networks:
  middleware:
    external: true
    name: ${WEKNORA_MIDDLEWARE_NETWORK:-weknora_WeKnora-network-dev}

volumes:
  rustfs-data:
    name: hqzy-knowledge-rustfs-data
  app-data:
    name: hqzy-knowledge-app-data
  docreader-tmp:
    external: true
    name: ${WEKNORA_DOCREADER_TMP_VOLUME:-weknora_docreader-tmp-dev}
